<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一路长歌 · UI 运行预览</title><style>*{box-sizing:border-box}body{margin:0;background:#101b26;color:#f2ead7;font-family:system-ui}header{max-width:1000px;margin:24px auto 18px;padding:0 20px}h1{font-size:24px;margin:0 0 8px}p{color:#aebdc8;font-size:14px;margin:6px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select,a{border:1px solid #5d6470;border-radius:8px;padding:9px 13px;background:#1c2c3b;color:#ead8b0;font:inherit;cursor:pointer;text-decoration:none}button.active{background:#d3b273;color:#142332;border-color:#d3b273}main{display:flex;justify-content:center;padding:0 10px 30px}iframe{border:1px solid #526174;border-radius:14px;box-shadow:0 14px 60px #0006;background:#101b26;max-width:100%}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}</style><header><h1>一路长歌 · UI 更新预览</h1><p>正式源码构建的 Cocos 网页画面，可直接点击、滑动和出征。此入口使用独立测试进度。</p><nav id="nav"></nav><div class="row"><label>屏幕尺寸 <select id="size"><option>375×667</option><option selected>402×874</option><option>360×640</option><option>430×932</option></select></label><button id="safe">模拟安全区：关</button><a id="full" target="_blank">单独打开</a></div></header><main><iframe id="game" title="一路长歌实际运行画面" allow="autoplay"></iframe></main><script>
const screens=[['首页','home'],['图鉴','collection:people'],['兵器','collection:weapons'],['宝物','collection:treasures'],['人物详情','person:zhuge'],['未遇剪影','person:lukang'],['整备','prepare:weapons'],['地图','map'],['结算','result'],['奖励','reward:0'],['设置','settings']];const frame=document.querySelector('#game');let fixture='home',safe=false;
function navigate(f){fixture=f;const url='/?yilu-review=UI:'+f+'&ui-skin=full';document.querySelector('#full').href=url;const api=frame.contentWindow?.__YLCG__;if(api){api.reviewCommand('ui-fixture',f);if(safe)api.reviewCommand('safe-insets',{top:44,bottom:34})}else frame.src=url;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.fixture===f))}
for(const [label,f] of screens){const b=document.createElement('button');b.textContent=label;b.dataset.fixture=f;b.onclick=()=>navigate(f);document.querySelector('nav').append(b)}function resize(){const [w,h]=document.querySelector('#size').value.split('×');frame.width=w;frame.height=h}document.querySelector('#size').onchange=resize;document.querySelector('#safe').onclick=()=>{safe=!safe;document.querySelector('#safe').textContent='模拟安全区：'+(safe?'开':'关');frame.contentWindow?.__YLCG__?.reviewCommand('safe-insets',safe?{top:44,bottom:34}:null)};resize();navigate('home');
</script></html>
