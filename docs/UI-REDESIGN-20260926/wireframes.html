<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一路长歌 · UI 重构 · 6 张关键界面中保真线框</title>
<style>
:root{
 --ink9:#0E1826;--ink8:#15243A;--ink7:#1E3350;--slate:#2C3E4A;
 --g3:#E6CD93;--g5:#C9A45C;--g7:#8A6630;
 --p1:#F3EAD6;--p3:#DCCBA6;--pink:#2A2016;
 --r6:#B23A2B;--r8:#7A2419;--b4:#6FA3D8;--b6:#2F66A3;--jade:#3E8C7A;
 --hi:#F5EFE2;--mid:#C4BEB0;--low:#87847C;
 --iron:#8A9099;--bronze:#B0773F;--silver:#C9D1DA;--tgold:#D9B25A;
 --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong",serif;
 --sans:"PingFang SC","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#ddd;font-family:var(--sans);padding:24px}
header{max-width:1200px;margin:0 auto 20px}
header h1{font-family:var(--serif);font-size:22px;color:var(--g3)}
header p{font-size:13px;color:#aaa;margin-top:6px;line-height:1.6}
header label{font-size:13px;color:var(--g3);cursor:pointer;display:inline-block;margin-top:8px}
.grid{display:flex;flex-wrap:wrap;gap:36px;justify-content:center}
figure{width:360px}
figcaption{font-size:13px;color:var(--g3);margin-bottom:8px;font-family:var(--serif)}
figcaption small{display:block;color:#999;font-family:var(--sans);font-size:11px;margin-top:2px;line-height:1.5}
.phone{position:relative;width:360px;height:780px;overflow:hidden;border-radius:28px;background:#222;box-shadow:0 0 0 2px #333,0 10px 30px #000a}
.abs{position:absolute}
.statusbar{left:0;top:0;width:100%;height:44px;font-size:12px;color:#fff;padding:14px 24px;z-index:50;text-shadow:0 1px 2px #0008}
.capsule{right:8px;top:48px;width:88px;height:32px;border-radius:16px;background:#0006;border:1px solid #fff5;z-index:50;display:flex;align-items:center;justify-content:space-around;color:#fff;font-size:14px}
/* ---- world ---- */
.sky{inset:0 0 auto 0;height:170px;background:linear-gradient(#9fb3b8,#c9cdb9 60%,#b9b596)}
.mount{top:70px;left:-20px;width:400px;height:110px;background:linear-gradient(#5f7672,#8a9a88);clip-path:polygon(0 70%,12% 30%,22% 55%,35% 10%,48% 50%,60% 25%,72% 60%,85% 20%,100% 55%,100% 100%,0 100%)}
.grass{top:150px;left:0;width:100%;height:630px;background:linear-gradient(#8f9a78,#7d8a64)}
.road{top:150px;left:0;width:100%;height:630px;background:
 repeating-linear-gradient(0deg,#0000 0 38px,#0000000a 38px 40px),
 linear-gradient(#cdb993,#d9c49c 50%,#d4bc92);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.rut{top:150px;width:2px;height:630px;background:#a8906c55;transform-origin:top}
.city{top:150px;left:150px;width:60px;height:34px;background:#6d6150;clip-path:polygon(0 30%,15% 30%,15% 0,35% 0,35% 30%,65% 30%,65% 0,85% 0,85% 30%,100% 30%,100% 100%,0 100%)}
.fence{left:178px;width:4px;background:repeating-linear-gradient(#6b4a2a 0 10px,#8a6238 10px 14px);z-index:5}
.fence::before,.fence::after{content:"";position:absolute;left:-5px;width:14px;height:12px;background:#8d8a80;border-radius:3px}
.fence::before{top:-8px}.fence::after{bottom:-6px}
.fence .fl{position:absolute;left:4px;top:-26px;width:14px;height:10px;background:var(--g5);clip-path:polygon(0 0,100% 20%,70% 50%,100% 80%,0 100%)}
.fence .fl:before{content:"";position:absolute}
.fencePosts{left:170px;width:20px;z-index:5;background:repeating-linear-gradient(90deg,#0000 0 8px,#0000 8px 12px),repeating-linear-gradient(#0000 0 12px,#7a5530 12px 16px);}
.prop{background:#6a5a44;border-radius:3px}
.hint-zone{left:0;width:100%;border-top:1px dashed #ff4d8d;z-index:80;pointer-events:none;display:none}
.hint-zone span{position:absolute;left:4px;top:2px;font-size:10px;color:#ff4d8d;background:#000a;padding:0 4px;border-radius:2px}
body.zones .hint-zone{display:block}
/* ---- gate ---- */
.gate{z-index:10;display:flex;flex-direction:column;align-items:center}
.gate .beam{width:100%;height:6px;background:#5b3d22;border-radius:2px;position:relative}
.gate .post{position:absolute;top:-10px;width:6px;height:96px;background:linear-gradient(90deg,#4a311b,#7a5530,#4a311b);border-radius:2px}
.gate .post.l{left:-2px}.gate .post.r{right:-2px}
.gate .post i{position:absolute;left:-1px;width:8px;height:4px;background:#b0773f}
.gate .ban{margin-top:2px;width:84%;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative}
.gate.plus .ban{background:var(--b6);border-bottom:3px solid var(--g5);box-shadow:inset 0 -6px 0 #0002}
.gate.minus .ban{background:var(--r6);clip-path:polygon(0 0,100% 0,100% 88%,88% 100%,76% 90%,62% 100%,50% 90%,38% 100%,24% 90%,12% 100%,0 90%)}
.gate.zero .ban{background:var(--p3);color:var(--pink)}
.num{font-family:"DIN Alternate","Arial Black",var(--sans);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gate .num{font-size:30px;line-height:1;-webkit-text-stroke:0;text-shadow:0 2px 0 #0006,1.5px 0 0 #0005,-1.5px 0 0 #0005}
.gate.plus .num{text-shadow:0 2px 0 #123a66,2px 0 0 #123a66,-2px 0 0 #123a66,0 -2px 0 #123a66}
.gate.minus .num{text-shadow:0 2px 0 #5a160e,2px 0 0 #5a160e,-2px 0 0 #5a160e,0 -2px 0 #5a160e}
.gate .sub{font-size:11px;font-family:var(--serif);opacity:.92;margin-top:3px;letter-spacing:2px}
.gate .grow{position:absolute;left:8%;bottom:6px;width:84%;height:3px;background:#0004}
.gate .grow b{display:block;height:100%;background:var(--g3);width:60%}
.gate .topflag{position:absolute;top:-24px;width:12px;height:10px;background:var(--g5);clip-path:polygon(0 0,100% 20%,70% 50%,100% 80%,0 100%)}
.gate.minus .topflag{background:none;width:3px;height:16px;top:-26px;border-left:3px solid #3a2a1a;transform:rotate(25deg)}
/* ---- crates ---- */
.crate{z-index:9;display:flex;flex-direction:column;align-items:center}
.tag{background:var(--p1);color:var(--pink);font-size:12px;padding:3px 7px;border-radius:3px;display:flex;align-items:center;gap:4px;box-shadow:0 1px 2px #0005;white-space:nowrap;font-family:var(--serif);font-weight:700}
.tag.blue{background:var(--b6);color:#fff}
.tag.gold{border:1.5px solid var(--g5)}
.rope{width:1px;height:8px;background:#5b3d22}
.ico{display:inline-block;width:14px;height:14px;border-radius:2px;background:currentColor;opacity:.8}
.wbox{width:58px;height:34px;background:linear-gradient(#7a5530,#5b3d22);border:2px solid var(--bronze);border-radius:3px;position:relative}
.wbox::after{content:"";position:absolute;left:8px;right:8px;top:14px;height:3px;background:#2a1a0e;box-shadow:0 0 0 1px #b0773f55}
.cart{width:52px;height:30px;background:#8a6a44;border-radius:4px 4px 0 0;position:relative}
.cart::before,.cart::after{content:"";position:absolute;bottom:-9px;width:16px;height:16px;border-radius:50%;border:3px solid #4a311b;background:#6b4a2a}
.cart::before{left:2px}.cart::after{right:2px}
.cart i{position:absolute;top:-10px;left:10px;width:30px;height:14px;background:#c9b48a;border-radius:8px}
.dur{display:flex;gap:2px;margin-top:10px}
.dur b{width:8px;height:4px;background:var(--g3)}
.dur b.off{background:#0005}
.lacq{width:36px;height:30px;background:linear-gradient(#2a1a14,#120a08);border:2px solid var(--g5);border-radius:3px;position:relative}
.lacq::after{content:"";position:absolute;left:13px;top:10px;width:6px;height:8px;background:var(--g5);border-radius:1px}
/* ---- units ---- */
.u{position:absolute;border-radius:50% 50% 40% 40%;z-index:20}
.soldier{width:13px;height:18px;background:#4f6078;box-shadow:0 0 0 1px #1a2230}
.esoldier{width:13px;height:18px;background:#8a4a3a;box-shadow:0 0 0 1px #2a1410}
.hero{width:24px;height:34px;background:#e8e0cc;box-shadow:0 0 0 1.5px #1a2230;z-index:25}
.hero::after{content:"";position:absolute;left:-6px;top:8px;width:36px;height:24px;background:#2f5fb3;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);z-index:-1}
.ring{position:absolute;border-radius:50%;z-index:19}
.ring.gold{border:2px solid var(--g5);background:#c9a45c22}
.ring.silver{border:1.5px solid var(--silver)}
.comp{width:20px;height:28px;background:#6a7690;box-shadow:0 0 0 1.5px #1a2230;z-index:24}
.backflag{position:absolute;width:12px;height:18px;font-size:9px;color:#fff;text-align:center;line-height:18px;font-family:var(--serif);z-index:26}
.troop{z-index:40;display:flex;align-items:center;gap:3px;background:var(--ink8);border:1px solid var(--g5);padding:2px 8px 2px 8px;border-radius:2px;color:#fff}
.troop .num{font-size:22px}
.troop small{font-size:11px;color:var(--g3);font-family:var(--serif)}
.pole{width:2px;background:#5b3d22;z-index:39}
.delta{z-index:41;font-size:18px;color:var(--b4);text-shadow:0 1px 0 #123a66,1px 0 0 #123a66,-1px 0 0 #123a66}
.delta.neg{color:#ff8a78;text-shadow:0 1px 0 #5a160e,1px 0 0 #5a160e,-1px 0 0 #5a160e}
/* ---- HUD ---- */
.hud{z-index:60}
.ibtn{width:32px;height:32px;background:rgba(21,36,58,.82);border:1px solid #c9a45c55;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--hi);font-size:12px;letter-spacing:-1px}
.pill{height:28px;background:rgba(21,36,58,.82);border-radius:14px;color:var(--hi);font-family:var(--serif);font-size:14px;display:flex;align-items:center;padding:0 12px;gap:6px}
.pill em{font-style:normal;color:var(--g3)}
.march{height:20px}
.march .track{position:absolute;left:0;right:0;top:8px;height:4px;background:rgba(21,36,58,.7);border-radius:2px}
.march .done{position:absolute;left:0;top:8px;height:4px;background:var(--g5);border-radius:2px}
.march .node{position:absolute;top:3px;width:12px;height:12px;transform:rotate(45deg);background:var(--r6);border:1.5px solid var(--p1)}
.march .end{position:absolute;right:-4px;top:0;width:20px;height:18px;background:#6d6150;border:1.5px solid var(--p1);border-radius:3px;font-size:10px;color:#fff;text-align:center;line-height:15px;font-family:var(--serif)}
.march .me{position:absolute;top:-2px;width:10px;height:14px;background:var(--b6);border:1.5px solid var(--g3);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.march .cnt{position:absolute;right:26px;top:-16px;font-size:11px;color:var(--hi);text-shadow:0 1px 2px #000}
.wchip{display:flex;gap:6px;align-items:center;background:rgba(21,36,58,.82);border-radius:6px;padding:4px 10px 4px 4px}
.well{width:32px;height:32px;border-radius:6px;background:var(--ink7);border:2px solid var(--tgold);display:flex;align-items:center;justify-content:center;color:var(--g3);font-family:var(--serif);font-size:13px}
.wchip .n{font-family:var(--serif);font-size:13px;color:var(--hi);line-height:1.1}
.wchip .pips{color:var(--g5);font-size:10px;letter-spacing:1px}
.wchip .pips i{color:#fff3;font-style:normal}
.wchip .sub{font-size:10px;color:var(--mid)}
.tslots{display:flex;gap:6px}
.ts{width:32px;height:32px;border-radius:6px;background:rgba(21,36,58,.82);border:1.5px solid var(--g5);position:relative;color:var(--g3);font-size:11px;font-family:var(--serif);display:flex;align-items:center;justify-content:center}
.ts b{position:absolute;right:-4px;bottom:-4px;min-width:14px;height:14px;border-radius:7px;background:var(--r6);color:#fff;font-size:10px;line-height:14px;text-align:center;font-family:var(--sans)}
.ts.round{border-radius:50%;border-color:var(--jade)}
.ts.cd::after{content:"";position:absolute;inset:0;border-radius:inherit;background:conic-gradient(#0009 0 70%,#0000 70%)}
.toast{z-index:70;height:32px;background:rgba(21,36,58,.9);border-left:3px solid var(--g5);border-radius:0 16px 16px 0;color:var(--hi);font-size:14px;display:flex;align-items:center;padding:0 14px;font-family:var(--serif)}
.toast.danger{border-left-color:var(--r6)}
.hand{z-index:70;width:44px;height:44px;border-radius:50%;border:2px dashed #fff8}
/* ---- boss ---- */
.bossplate{display:flex;gap:8px;align-items:center;background:rgba(21,36,58,.86);border-radius:6px;padding:4px 10px 4px 4px}
.bossplate .av{width:40px;height:40px;border-radius:50%;border:2px solid var(--r6);background:radial-gradient(#8a4a3a,#3a1a14);color:#fff;font-family:var(--serif);display:flex;align-items:center;justify-content:center;font-size:16px}
.bossplate .nm{font-family:var(--serif);color:var(--hi);font-size:16px}
.bossplate .nm small{color:var(--g3);font-size:11px;margin-left:4px}
.bossplate .bar{position:relative;height:8px;background:var(--ink9);border-radius:1px;margin-top:4px;overflow:hidden}
.bossplate .bar .trail{position:absolute;left:0;top:0;bottom:0;width:72%;background:var(--p3)}
.bossplate .bar .hp{position:absolute;left:0;top:0;bottom:0;width:64%;background:var(--r6)}
.bossplate .bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink9)}
.bossplate .ph{font-family:var(--serif);color:var(--g3);font-size:12px;align-self:flex-end}
.warn{z-index:65;width:56px;background:var(--r8);color:var(--g3);display:flex;flex-direction:column;align-items:center;padding:12px 0;box-shadow:-4px 0 12px #0006;clip-path:polygon(0 0,100% 0,100% 100%,50% 94%,0 100%)}
.warn .v{writing-mode:vertical-rl;font-family:var(--serif);font-size:26px;font-weight:900;letter-spacing:6px;color:var(--g3)}
.warn .s{writing-mode:vertical-rl;font-size:11px;color:var(--p1);margin-top:10px;letter-spacing:2px}
.dais{z-index:8;border-radius:50%;border:2px solid #b23a2b99;background:repeating-conic-gradient(#b23a2b33 0 22.5deg,#0000 22.5deg 45deg)}
.egen{width:30px;height:42px;background:#a0503c;box-shadow:0 0 0 1.5px #2a1410;z-index:22}
.boss{width:44px;height:62px;background:#9a3a2c;box-shadow:0 0 0 2px #2a1410;z-index:22}
.bigflag{z-index:21;width:16px;height:30px;background:var(--r8);border-left:2px solid #3a2a1a}
.nameplate{z-index:30;background:var(--r8);color:var(--p1);font-family:var(--serif);font-size:12px;padding:1px 6px;border-radius:2px}
.ebar{z-index:30;height:5px;width:48px;background:var(--ink9)}
.ebar b{display:block;height:100%;width:70%;background:var(--r6)}
.tele{z-index:7;border-radius:50%;border:2px dashed var(--r6);background:#b23a2b22}
.tele.lock{border-style:solid;background:#b23a2b44}
/* ---- pages ---- */
.page{background:linear-gradient(#15243A,#0E1826)}
.paper{background:var(--p1);color:var(--pink);border-radius:4px}
.btnP{height:56px;border-radius:6px;background:linear-gradient(#d3b068,#b8914a);color:var(--ink9);font-family:var(--serif);font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:4px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.btnS{height:48px;border-radius:6px;border:1px solid var(--g5);color:var(--hi);font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--ink8)}
.btnT{color:var(--g3);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.ttl{font-family:var(--serif);color:var(--hi);font-size:18px}
.lbl{font-size:11px;color:var(--mid)}
.card{background:var(--ink7);border-radius:4px;border:1px solid #c9a45c44;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px;color:var(--hi);font-family:var(--serif)}
.card.sel{border:2px solid var(--g5)}
.card:not(.abs){position:relative}
.portrait{width:100%;flex:1;border-radius:3px;background:linear-gradient(#3a4a60,#1e2a3a);position:relative}
.portrait::after{content:"";position:absolute;left:30%;right:30%;top:18%;bottom:0;background:#8b93a3;border-radius:40% 40% 0 0}
.seal{position:absolute;width:20px;height:20px;border-radius:3px;font-size:11px;font-family:var(--serif);color:#fff;display:flex;align-items:center;justify-content:center}
.slot{border:1.5px dashed #c9a45c88;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--g3);font-family:var(--serif);font-size:13px;flex-direction:column;gap:2px;background:#0003}
.slot.full{border:1.5px solid var(--g5);background:var(--ink7)}
.slot.lock{border-color:#87847c66;color:var(--low)}
.mini{width:30px;height:30px;border-radius:6px;background:var(--ink7);border:1.5px solid var(--bronze);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--g3);font-family:var(--serif);position:relative}
.mini .gui{position:absolute;right:-5px;top:-5px;width:14px;height:14px;background:var(--g5);color:var(--ink9);font-size:9px;border-radius:2px;line-height:14px;text-align:center}
/* map */
.fog{background:radial-gradient(ellipse at center,#1a2432ee,#0e1826f5);backdrop-filter:blur(1px)}
.cnode{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;color:#fff;flex-direction:column;z-index:10}
.cnode.done{background:#6d6150;border:2px solid var(--p3)}
.cnode.done::after{content:"克";position:absolute;right:-6px;top:-6px;width:22px;height:22px;background:var(--r6);color:#fff;font-size:12px;border-radius:3px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.cnode.cur{background:#8a6a44;border:3px solid var(--g5);box-shadow:0 0 0 6px #c9a45c33,0 0 20px #c9a45c88}
.cnode.lock{background:#2a3440;border:2px solid #87847c55;color:var(--low)}
.path{z-index:5;border-left:3px dashed #b23a2b99}
.region{font-family:var(--serif);color:#f3ead6aa;font-size:14px;letter-spacing:6px;z-index:11}
.fseal{width:40px;height:40px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);color:#fff;font-size:14px;line-height:1.1}
.fseal small{font-size:9px;font-family:var(--sans);opacity:.85}
</style>
</head>
<body>
<header>
 <h1>一路长歌：三国 · UI 重构 · 6 张关键界面中保真线框</h1>
 <p>画框 360×780pt（@2x = 720×1560，与工程 720 设计宽一致）。色值、字号、间距与 <code>tokens.json</code> 一致；人物与场景以色块占位，高保真时在真实战斗截图上替换 UI 与目标元素。右上半透明胶囊为微信系统胶囊占位。配套说明见 <code>UI重构方案.md</code> Part 3 / 5.3。</p>
 <label><input type="checkbox" id="z" onchange="document.body.classList.toggle('zones',this.checked)"> 显示战斗五区参考线（Z1–Z4）</label>
</header>

<div class="grid">

<!-- ===================== 1 战斗 · 常规行军态 ===================== -->
<figure>
<figcaption>图1 · 战斗 · 常规行军态<small>HUD 三行（暂停/关名 · 行军条 · 兵器签/宝物位）；左增右减两扇辕门，中间矮木栅带端头；兵器匣与粮车；兵力帅旗只在己方区。</small></figcaption>
<div class="phone" id="f1">
 <div class="abs sky"></div><div class="abs mount"></div><div class="abs grass"></div><div class="abs road"></div>
 <div class="abs city"></div>
 <div class="abs prop" style="left:14px;top:300px;width:40px;height:34px"></div>
 <div class="abs prop" style="left:318px;top:420px;width:30px;height:48px;background:#5b4a38"></div>
 <div class="abs statusbar">9:41</div><div class="abs capsule">··· ◉</div>

 <!-- center fence -->
 <div class="abs fence" style="top:206px;height:270px"><span class="fl"></span></div>

 <!-- gates (Z2) -->
 <div class="abs gate plus" style="left:70px;top:236px;width:104px">
