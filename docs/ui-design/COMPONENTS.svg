<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1550" viewBox="0 0 1080 1550" style="font-family:PingFang SC,system-ui,sans-serif"><rect width="1080" height="1550" fill="#e9e7dd"/><text x="40" y="60" font-size="30" font-weight="700" fill="#19363d" text-anchor="start" >轻量三国军阵</text><text x="40" y="92" font-size="15" font-weight="500" fill="#19363d" text-anchor="start" >UI-01 / 共用组件 · 逻辑像素 1:1</text><text x="40" y="120" font-size="14" font-weight="500" fill="#596d67" text-anchor="start" >交互与数值沿用现有游戏；色块与文字分离，控件与热区同源。</text><text x="40" y="170" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >01  出征按钮</text><text x="40" y="194" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >高度 56 / 横向拉伸 / 热区等于外框</text><path  d="M45 214H167L172 219V265L167 270H45L40 265V219Z" fill="#a94030" /><text x="106" y="248" font-size="17" font-weight="600" fill="#f4ecd9" text-anchor="middle" >继续征程</text><text x="40" y="294" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >默认</text><path  d="M190 214H312L317 219V265L312 270H190L185 265V219Z" fill="#863225" /><text x="251" y="248" font-size="17" font-weight="600" fill="#f4ecd9" text-anchor="middle" >继续征程</text><text x="185" y="294" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >按下：色深 + 内容下移 1</text><path  d="M335 214H457L462 219V265L457 270H335L330 265V219Z" fill="#9eaaa2" /><text x="396" y="248" font-size="17" font-weight="600" fill="#f4ecd9" text-anchor="middle" >继续征程</text><text x="330" y="294" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >禁用：不可点</text><text x="560" y="170" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >02  紧凑二级入口</text><text x="560" y="194" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >可见区及热区至少 44 × 44；标签必须保留</text><path  d="M565 214H689L694 219V253L689 258H565L560 253V219Z" fill="#19363d" /><g transform="translate(572 227) scale(0.75)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 2v21M5 3h15l-4 6 4 5H5"/></g><text x="600" y="242" font-size="13" font-weight="500" fill="#f4ecd9" text-anchor="start" >整备队伍</text><text x="560" y="285" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >解锁后显示</text><path  d="M711 214H835L840 219V253L835 258H711L706 253V219Z" fill="#19363d" /><g transform="translate(718 227) scale(0.75)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 6a9 9 0 1 1-2 11M2 2v7h7"/></g><text x="746" y="242" font-size="13" font-weight="500" fill="#f4ecd9" text-anchor="start" >重玩关卡</text><text x="706" y="285" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >打开关卡；不删档</text><path  d="M857 214H981L986 219V253L981 258H857L852 253V219Z" fill="#19363d" /><g transform="translate(864 227) scale(0.75)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M8 3h8l1 4 4 2v6l-4 2-1 4H8l-1-4-4-2V9l4-2Z M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/></g><text x="892" y="242" font-size="13" font-weight="500" fill="#f4ecd9" text-anchor="start" >设置</text><text x="852" y="285" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >音效 / 震动</text><text x="40" y="358" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >03  武器与自动状态</text><text x="40" y="382" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >24 高 / 文字 12 / 无点击、无技能释放热区</text><path  d="M45 405H167L172 410V424L167 429H45L40 424V410Z" fill="#19363d" /><g transform="translate(47 408) scale(0.75)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 22 20 3M17 3l4-2-1 5M10 16l-3-3"/></g><text x="72" y="422" font-size="12" font-weight="600" fill="#f4ecd9" text-anchor="start" >长枪 Ⅰ</text><path  d="M188 405H310L315 410V424L310 429H188L183 424V410Z" fill="#19363d" /><g transform="translate(190 408) scale(0.75)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 23l5-7M8 17C20 15 22 7 21 2C18 9 12 10 8 12l-2 4M5 14l6 6"/></g><text x="215" y="422" font-size="12" font-weight="600" fill="#f4ecd9" text-anchor="start" >长刀 Ⅲ</text><path  d="M331 405H453L458 410V424L453 429H331L326 424V410Z" fill="#785324" /><g transform="translate(333 408) scale(0.75)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></g><text x="358" y="422" font-size="12" font-weight="600" fill="#f4ecd9" text-anchor="start" >觉醒 4.2秒</text><text x="40" y="461" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >升阶短提示绑定原事件；觉醒细环随剩余秒数走完并淡出。</text><text x="560" y="358" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >04  随军与待命</text><text x="560" y="382" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >24 高 / 姓名不截断为省略号 / 待命不表现为出战</text><path  d="M565 405H753L758 410V424L753 429H565L560 424V410Z" fill="#19363d" /><g transform="translate(566 409) scale(0.6666666666666666)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 2v21M5 3h15l-4 6 4 5H5"/></g><text x="590" y="422" font-size="12" font-weight="500" fill="#f4ecd9" text-anchor="start" >赵云同行助阵</text><path  d="M777 405H965L970 410V424L965 429H777L772 424V410Z" fill="#19363d" /><g transform="translate(778 409) scale(0.6666666666666666)" fill="none" stroke="#bfc9be" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 2v21M5 3h15l-4 6 4 5H5"/></g><text x="802" y="422" font-size="12" font-weight="500" fill="#bfc9be" text-anchor="start" >邢道荣 · 待命</text><text x="560" y="461" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >无队友收起；同名 Boss 按现有本场待命状态呈现。</text><text x="40" y="528" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >05  世界标签</text><text x="40" y="552" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >对象位置不动；标签有边界、独立锚点与细引线</text><path  d="M45 575H93L98 580V592L93 597H45L40 592V580Z" fill="#19363d" /><g transform="translate(44 578) scale(0.5833333333333334)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></g><text x="60" y="590" font-size="12" font-weight="500" fill="#f4ecd9" text-anchor="start" >精锐</text><path d="M45 595h48" stroke="#d78063" stroke-width="3"/><path  d="M123 575H231L236 580V598L231 603H123L118 598V580Z" fill="#553f36" /><text x="177" y="593" font-size="12" font-weight="600" fill="#f4ecd9" text-anchor="middle" >山石 · 碰撞 −8</text><path  d="M259 575H331L336 580V596L331 601H259L254 596V580Z" fill="#19363d" /><text x="295" y="593" font-size="12" font-weight="600" fill="#f4ecd9" text-anchor="middle" >碰撞 −5</text><text x="40" y="640" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >文字 12；损失数字至少 12；高密度标签间留 6。</text><text x="40" y="663" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >血条 3 高、最小 48 宽；精锐为图标 + 文字。</text><text x="560" y="528" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >06  事件提示</text><text x="560" y="552" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >只改变呈现；优先级与寿命仍读 BattleNotice</text><path  d="M565 575H677L682 580V602L677 607H565L560 602V580Z" fill="#226659" /><text x="621" y="596" font-size="14" font-weight="600" fill="#f4ecd9" text-anchor="middle" >兵力 +12</text><path  d="M705 575H1023L1028 580V602L1023 607H705L700 602V580Z" fill="#73382d" /><text x="864" y="596" font-size="14" font-weight="600" fill="#f4ecd9" text-anchor="middle" >飞叉将至 · 命中 −12</text><path  d="M565 627H751L756 632V654L751 659H565L560 654V632Z" fill="#19363d" /><text x="658" y="648" font-size="14" font-weight="600" fill="#d8b879" text-anchor="middle" >长刀升至 Ⅲ 阶</text><text x="560" y="691" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >危险 > 成长 > 聚兵；不新建常驻告警或主动技能。</text><text x="40" y="752" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >07  暂停小面板</text><text x="40" y="776" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >墨青标题 + 暖纸内容；不恢复满屏双金线</text><path  d="M45 800H455L460 805V1105L455 1110H45L40 1105V805Z" fill="#f4ecd9" /><path  d="M45 800H455L460 805V843L455 848H45L40 843V805Z" fill="#19363d" /><text x="60" y="831" font-size="19" font-weight="600" fill="#f4ecd9" text-anchor="start" >暂歇片刻</text><path  d="M61 864H439L444 869V903L439 908H61L56 903V869Z" fill="#a94030" /><text x="250" y="893" font-size="15" font-weight="600" fill="#f4ecd9" text-anchor="middle" >继续征程</text><path  d="M61 920H439L444 925V959L439 964H61L56 959V925Z" fill="#19363d" /><text x="250" y="949" font-size="15" font-weight="600" fill="#f4ecd9" text-anchor="middle" >重新开始</text><path  d="M61 976H439L444 981V1015L439 1020H61L56 1015V981Z" fill="#19363d" /><text x="250" y="1005" font-size="15" font-weight="600" fill="#f4ecd9" text-anchor="middle" >设置</text><path  d="M61 1032H439L444 1037V1071L439 1076H61L56 1071V1037Z" fill="#19363d" /><text x="250" y="1061" font-size="15" font-weight="600" fill="#f4ecd9" text-anchor="middle" >返回关卡</text><text x="40" y="1120" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >4项独立44高热区；回调沿用原有行为。</text><text x="560" y="752" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >08  整备选择卡</text><text x="560" y="776" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >仅列已解锁项目；已选 / 可选 / 本场待命</text><path  d="M565 800H1003L1008 805V857L1003 862H565L560 857V805Z" fill="#19363d" /><g transform="translate(575 818) scale(0.9166666666666666)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 12l5 5L20 6"/></g><text x="612" y="827" font-size="16" font-weight="600" fill="#f4ecd9" text-anchor="start" >邢道荣</text><text x="612" y="848" font-size="12" font-weight="500" fill="#bfc9be" text-anchor="start" >已选随军</text><path d="M562 805v52" stroke="#d8b879" stroke-width="3"/><path  d="M565 878H1003L1008 883V935L1003 940H565L560 935V883Z" fill="#19363d" /><g transform="translate(575 896) scale(0.9166666666666666)" fill="none" stroke="#bfc9be" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 2v21M5 3h15l-4 6 4 5H5"/></g><text x="612" y="905" font-size="16" font-weight="600" fill="#f4ecd9" text-anchor="start" >陈应</text><text x="612" y="926" font-size="12" font-weight="500" fill="#bfc9be" text-anchor="start" >可出战</text><path  d="M565 956H1003L1008 961V1013L1003 1018H565L560 1013V961Z" fill="#19363d" /><g transform="translate(575 974) scale(0.9166666666666666)" fill="none" stroke="#bfc9be" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 2v21M5 3h15l-4 6 4 5H5"/></g><text x="612" y="983" font-size="16" font-weight="600" fill="#f4ecd9" text-anchor="start" >赵云</text><text x="612" y="1004" font-size="12" font-weight="500" fill="#bfc9be" text-anchor="start" >同行助阵</text><text x="560" y="1072" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >热区为整卡 448 × 62；小屏用可用宽度，最少高 56。</text><text x="40" y="1150" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >09  结果与新增解锁</text><text x="40" y="1174" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >胜利 / 再胜 / 失败分别沿用既有数据与下一步</text><path  d="M45 1194H455L460 1199V1394L455 1399H45L40 1394V1199Z" fill="#f4ecd9" /><text x="60" y="1231" font-size="26" font-weight="700" fill="#19363d" text-anchor="start" >晋升领队</text><text x="60" y="1265" font-size="14" font-weight="500" fill="#19363d" text-anchor="start" >剩余兵力 88 · 进度已保存</text><path  d="M61 1282H439L444 1287V1307L439 1312H61L56 1307V1287Z" fill="#19363d" /><text x="72" y="1303" font-size="13" font-weight="500" fill="#d8b879" text-anchor="start" >获得：长刀 · 邢道荣随军</text><path  d="M61 1330H439L444 1335V1373L439 1378H61L56 1373V1335Z" fill="#a94030" /><text x="250" y="1361" font-size="17" font-weight="600" fill="#f4ecd9" text-anchor="middle" >整军待发</text><text x="560" y="1150" font-size="18" font-weight="650" fill="#19363d" text-anchor="start" >10  关间整军</text><text x="560" y="1174" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >保留拖旗入阵；未完成不能被“下一关”替代</text><path  d="M565 1194H1003L1008 1199V1394L1003 1399H565L560 1394V1199Z" fill="#f4ecd9" /><text x="580" y="1231" font-size="25" font-weight="650" fill="#19363d" text-anchor="start" >整军待发</text><text x="580" y="1265" font-size="14" font-weight="500" fill="#19363d" text-anchor="start" >把军旗拖入阵中，弟兄随你出征</text><path  d="M585 1290H635L640 1295V1345L635 1350H585L580 1345V1295Z" fill="#19363d" /><g transform="translate(596 1305) scale(1.2083333333333333)" fill="none" stroke="#d8b879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 2v21M5 3h15l-4 6 4 5H5"/></g><path d="M656 1320h138" stroke="#687f76" stroke-dasharray="5 5"/><g transform="translate(768 1309) scale(0.9166666666666666)" fill="none" stroke="#19363d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"> <path d="M3 12h18M15 6l6 6-6 6"/></g><rect x="814" y="1288" width="174" height="64" rx="4" fill="none" stroke="#82988a" stroke-dasharray="5 5"/><text x="900" y="1327" font-size="17" font-weight="500" fill="#19363d" text-anchor="middle" >军阵</text><text x="580" y="1380" font-size="12" font-weight="500" fill="#19363d" text-anchor="start" >先锋 12 人 · 其余弟兄留守</text><text x="40" y="1470" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >所有界面：保存失败沿用原提示；素材加载失败保留原重试入口。</text><text x="40" y="1495" font-size="12" font-weight="500" fill="#596d67" text-anchor="start" >本页是组件规范，不是新增游戏系统；动态文字不烘焙入纹理。</text></svg>